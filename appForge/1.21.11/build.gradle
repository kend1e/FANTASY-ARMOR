plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias(libs.plugins.forgeGradle)
}

def repositoryDir = rootProject.projectDir

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Compile shared code into the mod's source set so dev runs and jars both contain it.
// appCommon is still a project dependency for its compile-time dependencies.
sourceSets.main.java.srcDir "${repositoryDir}/appCommon/src/main/java"
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir "${repositoryDir}/appCommon/src/main/resources"
    // The copied 1.21.11 assets are replaced by shared assets in processResources.
    exclude { details ->
        def path = details.path
        def prefix = 'assets/fantasy_armor/'
        if (!path.startsWith(prefix)) return false
        def relative = path.substring(prefix.length())
        def directories = [
            'models/item/': 'item_models/', 'items/': 'items/',
            'textures/item/': 'icons/', 'textures/armor/': 'armor/',
            'geckolib/models/': 'geo/', 'lang/': 'lang_forge/'
        ]
        directories.any { destination, source ->
            relative.startsWith(destination) &&
                new File(repositoryDir, 'shared/resources/' + source + relative.substring(destination.length())).isFile()
        }
    }
    exclude 'data/minecraft/tags/item/dyeable.json'
    exclude 'data/minecraft/tags/item/enchantable/**'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*') }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    compileOnly project(':appCommon')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from("${repositoryDir}/shared/resources/item_models") { into 'assets/fantasy_armor/models/item' }
    from("${repositoryDir}/shared/resources/icons") { into 'assets/fantasy_armor/textures/item' }
    from("${repositoryDir}/shared/resources/armor") { into 'assets/fantasy_armor/textures/armor' }
    from("${repositoryDir}/shared/resources/geo") { into 'assets/fantasy_armor/geckolib/models' }
    from("${repositoryDir}/shared/resources/items") { into 'assets/fantasy_armor/items' }
    from("${repositoryDir}/shared/resources/lang_forge") { into 'assets/fantasy_armor/lang' }
    from("${repositoryDir}/shared/resources/tags") { into 'data/minecraft/tags/item' }
    // Shared assets are authoritative; exclude their old local copies below.
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
