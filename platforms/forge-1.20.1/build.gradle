plugins {
    id 'fantasy.platform'
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias(libs.plugins.forgeGradle)
    alias(libs.plugins.renamer)
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.18+ - Java 17.
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    // FG 7 also resolves this dependency in a detached dev-launch configuration.
    // Declare its variant explicitly; that configuration has no Java attributes.
    implementation minecraft.dependency(project.name, "net.minecraftforge:forge:${minecraft_version}-${forge_version}") {
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE, objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
            attribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE, objects.named(org.gradle.api.attributes.Category, org.gradle.api.attributes.Category.LIBRARY))
            attribute(org.gradle.api.attributes.Attribute.of('net.minecraftforge.mappings.channel', String), 'official')
            attribute(org.gradle.api.attributes.Attribute.of('net.minecraftforge.mappings.version', String), minecraft_version.toString())
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1', // We are version 1 of ourselves
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
}

dependencies {
    implementation renamer.dependency("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation libs.mclib
    compileOnly project(':core')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// Shared sources belong to the mod in dev runs as well as the published jar.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.resources.srcDir project(':core').tasks.named('processResources')

// Legacy Forge loads SRG names. Keep the development jar separate from the release jar.
renamer.mappings.from minecraft.getDependency(project.name).toSrgFile
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
}
tasks.named('assemble') { dependsOn tasks.named('renameJar') }

// Dependency refmaps use SRG names; dev Minecraft uses official names.
def devRefmapMappings = renamer.convert('devRefmapMappings', minecraft.getDependency(project.name).toSrgFile, 'srg') {
    reverse = true
}
minecraft.runs.configureEach {
    systemProperty 'mixin.env.remapRefMap', 'true'
    systemProperty 'mixin.env.refMapRemappingFile', devRefmapMappings.flatMap { it.output }.map { it.asFile.absolutePath }
}
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn devRefmapMappings
}
