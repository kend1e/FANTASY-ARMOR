plugins {
    id 'fantasy.platform'
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias(libs.plugins.forgeGradle)
    alias(libs.plugins.renamer)
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.buildDirectory.dir('generated/resources/datagen').get(), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir layout.buildDirectory.dir('generated/resources/datagen') }

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}
dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    // FG 7 also resolves this dependency in a detached dev-launch configuration.
    // Declare its variant explicitly; that configuration has no Java attributes.
    implementation minecraft.dependency(project.name, "net.minecraftforge:forge:${minecraft_version}-${forge_version}") {
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE, objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
            attribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE, objects.named(org.gradle.api.attributes.Category, org.gradle.api.attributes.Category.LIBRARY))
            attribute(org.gradle.api.attributes.Attribute.of('net.minecraftforge.mappings.channel', String), 'official')
            attribute(org.gradle.api.attributes.Attribute.of('net.minecraftforge.mappings.version', String), minecraft_version.toString())
        }
    }

    }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// Legacy Forge loads SRG names. Keep the development jar separate from the release jar.
renamer.mappings.from minecraft.getDependency(project.name).toSrgFile
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
}
tasks.named('assemble') { dependsOn tasks.named('renameJar') }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('renameJar')
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

dependencies {
    implementation renamer.dependency("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")
    compileOnly project(':core')
}

// Shared sources belong to the mod in dev runs as well as the published jar.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.resources.srcDir project(':core').tasks.named('processResources')

// Dependency refmaps use SRG names; dev Minecraft uses official names.
def devRefmapMappings = renamer.convert('devRefmapMappings', minecraft.getDependency(project.name).toSrgFile, 'srg') {
    reverse = true
}
minecraft.runs.configureEach {
    systemProperty 'mixin.env.remapRefMap', 'true'
    systemProperty 'mixin.env.refMapRemappingFile', devRefmapMappings.flatMap { it.output }.map { it.asFile.absolutePath }
}
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn devRefmapMappings
}
