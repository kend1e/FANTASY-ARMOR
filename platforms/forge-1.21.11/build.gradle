plugins {
    id 'fantasy.platform'
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias(libs.plugins.forgeGradle)
}

def repositoryDir = rootProject.projectDir

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

// Compile shared code into the mod's source set so dev runs and jars both contain it.
// core is still a project dependency for its compile-time dependencies.
sourceSets.main.java.srcDir "${repositoryDir}/core/src/main/java"
sourceSets.main.resources.srcDir project(':core').tasks.named('processResources')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config=fantasy_armor.mixins.json'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') { args '--nogui' }
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.buildDirectory.dir('generated/resources/datagen').get(), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*') }
    }
}

dependencies {
    implementation minecraft.dependency(project.name, "net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    compileOnly project(':core')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'fantasy_armor.mixins.json')
}
